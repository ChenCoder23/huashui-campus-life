version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: huashui_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: huashui_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: huashuiNB666
      RABBITMQ_DEFAULT_PASS: huashuiNB666pw

  minio:
    image: minio/minio:latest
    container_name: huashui_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: huashuiNB666
      MINIO_ROOT_PASSWORD: huashuiNB666pw
    command: server /data --console-address ":9001"

  xxl-job:
    image: xuxueli/xxl-job-admin:2.4.2
    container_name: huashui_xxljob
    ports:
      - "8200:8080"
    restart: unless-stopped
    environment:
      PARAMS: >
        --spring.datasource.url=jdbc:mysql://host.docker.internal:3308/xxl_job?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
        --spring.datasource.username=huashuiNB666
        --spring.datasource.password=huashuiNB666pw
        --xxl.job.accessToken=huashuiNB666
        --server.port=8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  redis_data:
  rabbitmq_data:
  minio_data:
