server:
  port: 8080

spring:
  application:
    name: huashui-gateway

  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive

  config:
    import:
      - nacos:shared-mysql.yml?group=DEFAULT_GROUP&refresh-enabled=true
      - nacos:shared-springdoc.yml?group=DEFAULT_GROUP&refresh-enabled=true
      - nacos:shared-redis.yml?group=DEFAULT_GROUP&refresh-enabled=true
      - nacos:shared-token.yml?group=DEFAULT_GROUP&refresh-enabled=true

  cloud:
    nacos:
      server-addr: 127.0.0.1:18848
      username: nacos
      password: Chc23pray

      discovery:
        fail-fast: false

      config:
        refresh-enabled: true

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # ==================== 基础能力层 ====================
        - id: huashui-auth
          uri: lb://huashui-auth
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

        # /user/** 实际由 huashui-auth 的 /user/inner/** 提供，原 huashui-user 服务不存在
        - id: huashui-user-inner
          uri: lb://huashui-auth
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=0

        - id: huashui-system
          uri: lb://huashui-system
          predicates:
            - Path=/system/**
          filters:
            - StripPrefix=0

        - id: huashui-dict
          uri: lb://huashui-system
          predicates:
            - Path=/dict/**
          filters:
            - StripPrefix=0

        - id: huashui-storage
          uri: lb://huashui-storage
          predicates:
            - Path=/storage/**
          filters:
            - StripPrefix=0

        # ==================== 核心业务层 ====================
        - id: huashui-dormitory
          uri: lb://huashui-dormitory
          predicates:
            - Path=/dormitory/**
          filters:
            - StripPrefix=0

        # 报修接口实际由 huashui-task 提供，原 huashui-repair 服务不存在
        - id: huashui-repair
          uri: lb://huashui-task
          predicates:
            - Path=/repair/**
          filters:
            - StripPrefix=0

        - id: huashui-utility
          uri: lb://huashui-utility
          predicates:
            - Path=/utility/**
          filters:
            - StripPrefix=0

        - id: huashui-evaluation
          uri: lb://huashui-evaluation
          predicates:
            - Path=/evaluation/**
          filters:
            - StripPrefix=0

        # ==================== 考勤与流程 ====================
        - id: huashui-attendance-service
          uri: lb://huashui-attendance-service
          predicates:
            - Path=/attendance/**
          filters:
            - StripPrefix=0

        # 考勤管理端路径为 /admin/attendance/**
        - id: huashui-attendance-admin
          uri: lb://huashui-attendance-service
          predicates:
            - Path=/admin/attendance/**
          filters:
            - StripPrefix=0

        - id: huashui-leave-service
          uri: lb://huashui-leave-service
          predicates:
            - Path=/leave/**
          filters:
            - StripPrefix=0

        - id: huashui-task
          uri: lb://huashui-task
          predicates:
            - Path=/task/**
          filters:
            - StripPrefix=0

        # ==================== 消息模块 ====================
        # 控制器实际路径为 /notice/** 和 /message/**，服务名为 huashui-message-notification
        - id: huashui-notice
          uri: lb://huashui-message-notification
          predicates:
            - Path=/notice/**
          filters:
            - StripPrefix=0

        - id: huashui-message
          uri: lb://huashui-message-notification
          predicates:
            - Path=/message/**
          filters:
            - StripPrefix=0